<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Uptime Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container login-page">
        <div class="login-box">
            <h1>Uptime Monitor</h1>
            <p class="subtitle" style="margin-bottom:0.5rem">by Digital Lentera Nusa</p>
            <p class="subtitle">Login untuk mengakses dashboard</p>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required autofocus>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p id="login-msg" class="form-msg"></p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('login-msg');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await resp.json();

            if (data.ok) {
                document.cookie = `session_token=${data.token}; path=/; SameSite=Strict`;
                window.location.href = '/';
            } else {
                msg.textContent = data.error || 'Login gagal';
                msg.className = 'form-msg error';
            }
        });
    </script>
</body>
</html>
